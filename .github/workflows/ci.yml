# 每次 push／PR：T12 hibernation 靜態檢查＋型別檢查＋全部測試。失敗即擋（ADR-006）。
# 只跑測試、不部署（ADR-049：憑證只在業主電腦的 cf.env，部署一律手動 scripts/deploy.sh）。
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:hibernation
      - run: pnpm typecheck
      - run: pnpm test
