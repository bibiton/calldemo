max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "qcs-history-dlq"
[[env.production.queues.consumers]]
queue = "qcs-push"
max_batch_size = 25
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "qcs-push-dlq"

[[env.production.analytics_engine_datasets]]
