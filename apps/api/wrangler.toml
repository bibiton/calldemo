# Worker：API（Hono）＋ StoreQueueDO ＋ queue consumer ＋ cron（08-deploy-and-ops §3）
# bindings 不會從頂層繼承到 env，每個 env 都完整寫一份。
# 環境只有兩個（ADR-049）：local（本機／測試，名稱維持 qcs-*-local，測試與 E2E 依賴，勿改）與 production（唯一部署環境）。
# 頂層不部署：scripts/ 一律帶 --env production；誤跑無 env 的 wrangler deploy 也只會建出名為 call-api 的空殼。
name = "call-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# DO class 只能新增；刪除／改名不可逆
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreQueueDO"]

[observability]
enabled = true

# ---------- local（wrangler dev／vitest；全部本機模擬）----------
[env.local]
name = "qcs-api-local"
vars = { ENV = "local", DEV_BYPASS_ACCESS = "1", APP_ORIGINS = "http://localhost:5171,http://localhost:5172,http://localhost:5173,http://localhost:5174,http://localhost:5175", MEDIA_BASE = "http://localhost:5174", CUSTOMER_BASE_URL = "http://localhost:5175" }

[[env.local.d1_databases]]
binding = "DB"
database_name = "qcs-db-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.kv_namespaces]]
binding = "LICENSE"
id = "qcs-license-local"

[[env.local.r2_buckets]]
binding = "MEDIA"
bucket_name = "qcs-media-local"

[[env.local.durable_objects.bindings]]
name = "STORE_QUEUE"
class_name = "StoreQueueDO"

[[env.local.queues.producers]]
binding = "Q_HISTORY"
queue = "qcs-history-local"
[[env.local.queues.producers]]
binding = "Q_PUSH"
queue = "qcs-push-local"

[[env.local.queues.consumers]]
queue = "qcs-history-local"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
[[env.local.queues.consumers]]
queue = "qcs-push-local"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 3

[env.local.triggers]
crons = ["5 * * * *", "30 19 * * *"]

# staging 已移除（ADR-049：DEMO 只有 production 一個環境，成本最低）。

# ---------- production（唯一部署環境，ADR-049）----------
# 共用 Cloudflare 帳號（jjoy.ai 上還有其他產品）：所有資源一律 call- 前綴＋ -production 後綴。
# scripts/lib.sh 的安全閘在部署前檢查本段每個名稱與網域，不是 call- 開頭就拒絕執行。
# 不設 DEV_BYPASS_ACCESS（production 帶此旗標時 Worker 拒絕運作）。
# secrets（不寫進檔案，由 scripts/bootstrap.sh 設定）：JWT_SECRET、PHONE_PEPPER、QR_ROOT_SECRET、VAPID_*、
#   ACCESS_AUD、ACCESS_TEAM_DOMAIN、ACCESS_ALLOWED_EMAILS、CF_ACCOUNT_ID、AE_API_TOKEN（Account Analytics Read）
[env.production]
name = "call-api-production"
routes = [
  { pattern = "call-api.jjoy.ai", custom_domain = true },
  # ADR-047：總後台 SPA 呼叫同源 /api/admin/*，由 call-admin.jjoy.ai 前面的 Access 注入 Cf-Access-Jwt-Assertion。
  # 「Worker route 優先於同 host 的 Pages 自訂網域」未查證；不成立時改用 admin Pages 專案內的 Pages Function 代理（08 §7）。
  { pattern = "call-admin.jjoy.ai/api/*", zone_name = "jjoy.ai" },
]
vars = { ENV = "production", APP_ORIGINS = "https://call-admin.jjoy.ai,https://call-store.jjoy.ai,https://call-staff.jjoy.ai,https://call-display.jjoy.ai,https://call-q.jjoy.ai", MEDIA_BASE = "https://call-media.jjoy.ai", CUSTOMER_BASE_URL = "https://call-q.jjoy.ai", AE_DATASET = "call_usage_production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "call-db-production"
database_id = "a90ed173-5a15-460c-be51-46736ed7c70f"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "LICENSE"
id = "3f21ed3f198d4185add9cd9f5ad12722"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "call-media-production"

[[env.production.durable_objects.bindings]]
name = "STORE_QUEUE"
class_name = "StoreQueueDO"

[[env.production.queues.producers]]
binding = "Q_HISTORY"
queue = "call-history-production"
[[env.production.queues.producers]]
binding = "Q_PUSH"
queue = "call-push-production"

[[env.production.queues.consumers]]
queue = "call-history-production"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "call-history-dlq-production"
[[env.production.queues.consumers]]
queue = "call-push-production"
max_batch_size = 25
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "call-push-dlq-production"

# Analytics Engine dataset 名稱用底線；首次寫入時自動建立，bootstrap 不需建立。
# 2026-10-27 首次部署：共用帳號尚未啟用 Analytics Engine（wrangler deploy 錯誤 10089 "You need to enable Analytics Engine"）。
# 啟用是帳號層級設定（不屬於 call- 資源），由業主在 dashboard → Workers & Pages → Analytics Engine 啟用後，取消下面 3 行的註解再部署。
# 未綁定時 Worker 與 DO 會略過 AE 寫入（app.ts／usage/ae.ts／store-queue.ts 皆判斷 env.USAGE），叫號功能不受影響；DO 計數仍經 Queue 寫 D1。
# [[env.production.analytics_engine_datasets]]
# binding = "USAGE"
# dataset = "call_usage_production"

[env.production.triggers]
crons = ["5 * * * *", "30 19 * * *"]
